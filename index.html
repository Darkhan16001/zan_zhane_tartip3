
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7f1">

  <title>Заң және тәртіп | BY DARKHAN</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="page-bg"></div>

  <header class="header">

    <div class="brand">
      <div class="logo">⚖️</div>
      <div>
        <strong>ЗАҢ ЖӘНЕ ТӘРТІП</strong>
        <small>АШЫҚ ТӘРБИЕ САҒАТЫ</small>
      </div>
    </div>

    <div class="header-right">
      <span id="phaseLabel">БАСТЫ БЕТ</span>
      <span id="clock">25:00</span>

      <button
        class="timer-button"
        id="timerButton"
        onclick="toggleTimer()"
        title="Таймерді қосу/тоқтату">
        ▶
      </button>
    </div>

  </header>

  <!-- ОҢ ЖАҚТАҒЫ БАСҚАРУ -->

  <aside class="right-panel">

    <button class="rail-button"
            onclick="showHome()">
      <span>⌂</span>
      <small>Басты</small>
    </button>

    <button class="rail-button"
            id="backButton"
            onclick="goBack()">
      <span>←</span>
      <small>Артқа</small>
    </button>

    <button class="rail-button primary"
            id="nextButton"
            onclick="goNext()">
      <span>→</span>
      <small>Келесі</small>
    </button>

    <button class="rail-button"
            onclick="showDrawing(0)">
      <span>🎨</span>
      <small>Сайыс</small>
    </button>

    <button class="rail-button"
            onclick="showFinal()">
      <span>🏆</span>
      <small>Нәтиже</small>
    </button>

    <button class="rail-button"
            onclick="toggleFullscreen()">
      <span>⛶</span>
      <small>Экран</small>
    </button>

  </aside>

  <!-- БАРЛЫҚ БЕТТЕР ОСЫНДА АШЫЛАДЫ -->

  <main id="app"></main>

  <footer class="footer">
    <span>ЗАҢ · ӘДІЛДІК · ЖАУАПКЕРШІЛІК</span>
    <strong>BY DARKHAN</strong>
  </footer>

</body>
</html>
